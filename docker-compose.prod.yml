# Production overrides for Hostinger / VPS.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Copy .env.production.example -> .env.production and set strong secrets before first boot.

services:
  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    ports: !reset []
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_BASE: ${VITE_BASE:-/}

  nginx:
    ports: !override
      - "${NGINX_PORT:-8082}:80"
