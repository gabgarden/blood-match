# Production overrides for Hostinger / VPS.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Copy .env.production.example -> .env.production and set strong secrets before first boot.

services:
  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file: !override
      - .env.production
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://bloodmatch.com.br:8082}
      REQUIRE_EMAIL_CONFIRMATION: ${REQUIRE_EMAIL_CONFIRMATION:-true}

  frontend:
    ports: !reset []
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_BASE: ${VITE_BASE:-/}

  nginx:
    image: nginx:1.27-alpine
    container_name: bloodmatch-nginx
    ports:
      - "${NGINX_PORT:-8082}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
