spring.application.name=bloodmatch
server.port=${PORT:8080}

# Local: prefer backend/.env, then monorepo root .env
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:bloodmatch}
spring.data.mongodb.auto-index-creation=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT settings
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:bloodmatch-api}

# Google Maps API
google.maps.api-key=${GOOGLE_MAPS_API_KEY}

# CORS (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://gabgarden.github.io}

# Configurações do Spring Mail (Suporta Hostinger, Titan Email, Google Workspace, Gmail, etc.)
spring.mail.host=${SPRING_MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:${GMAIL_USERNAME:bloodmatch.api@gmail.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${GMAIL_PASSWORD:change-me}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}